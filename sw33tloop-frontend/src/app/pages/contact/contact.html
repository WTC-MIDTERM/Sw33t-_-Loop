<section class="contact" id="contact">
  <div class="contact-txt">
    <h1>Contact Us</h1>
    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      <div class="contact-form">
        <label for="name"></label>
        <input type="text" id="name" formControlName="name" placeholder="Your Name" />

        <label for="email"></label>
        <input type="email" id="email" formControlName="email" placeholder="Your Email" />

        <label for="message"></label>
        <textarea id="message" formControlName="message" rows="5" placeholder="Your Message"></textarea>

        <button type="submit" [disabled]="submitting">
          {{ submitting ? 'SENDING...' : 'SEND MESSAGE' }}
        </button>

        @if (submitSuccess) {
          <p class="form-success">Thanks! Your message has been sent.</p>
        }
        @if (submitError) {
          <p class="form-error">Something went wrong. Please try again.</p>
        }
      </div>

      @if (info) {
        <div class="contact-link">
          <h2>Get In Touch</h2>
          <div class="contact-inner">
            <a><i class="fa-solid fa-phone"></i> {{ info.phone }}</a>
            <a href="https://maps.google.com"><i class="fa-solid fa-location-dot"></i> {{ info.address }}</a>
            <a [href]="'mailto:' + info.email"><i class="fa-solid fa-envelope"></i> {{ info.email }}</a>
            <div class="social-box">
              <div class="social-links">
                <a [href]="info.facebook"><i class="fa-brands fa-facebook"></i></a>
                <a [href]="info.instagram"><i class="fa-brands fa-instagram"></i></a>
                <a [href]="info.tiktok"><i class="fa-brands fa-tiktok"></i></a>
              </div>
            </div>
          </div>
        </div>
      }
    </form>
  </div>
</section>
