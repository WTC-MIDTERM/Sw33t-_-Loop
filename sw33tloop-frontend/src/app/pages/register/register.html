<section class="auth-page">
  <div class="auth-box">
    <h1>Create Account</h1>

    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      <label for="username">Username</label>
      <input type="text" id="username" formControlName="username" placeholder="Your name" />

      <label for="email">Email</label>
      <input type="email" id="email" formControlName="email" placeholder="you@example.com" />

      <label for="password">Password</label>
      <input type="password" id="password" formControlName="password" placeholder="At least 6 characters" />

      <button type="submit" [disabled]="submitting">
        {{ submitting ? 'CREATING...' : 'SIGN UP' }}
      </button>

      @if (errorMessage) {
        <p class="auth-error">{{ errorMessage }}</p>
      }
    </form>

    <p class="auth-switch">
      Already have an account? <a routerLink="/login">Log in</a>
    </p>
  </div>
</section>
